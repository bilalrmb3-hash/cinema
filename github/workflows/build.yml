name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك زر تشغيل البناء يدوياً في أي وقت

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. سحب الكود
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. توليد ملفات أندرويد تلقائياً إن لم تكن موجودة
      - name: Generate Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Flutter project files..."
            cp -r lib /tmp/lib_backup
            flutter create . --platforms=android --org com.cinemaplus.app --project-name cinema_plus
            rm -rf lib
            cp -r /tmp/lib_backup lib
          fi

      # 5. بناء تطبيق APK (نسخة Debug جاهزة للتثبيت فوراً دون الحاجة لتوقيع)
      - name: Build APK
        run: flutter build apk --debug

      # 6. رفع ملف الـ APK لتنزيله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cinema-plus-app
          path: build/app/outputs/flutter-apk/app-debug.apk
